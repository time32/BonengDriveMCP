[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boneng-drivesoft-mcp"
version = "0.11.1"
description = "Local MCP adapter and offline engineering tools for Boneng Drivesoft"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["mcp==1.30.0", "pnio-dcp==1.2.0", "psutil==7.2.2"]

[project.optional-dependencies]
analysis = ["access-parser==0.0.6"]

[project.scripts]
boneng-mcp = "boneng_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
